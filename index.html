<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node Endpoint Tester</title>
<style>
  body { background-color: #121212; color: #f5f5f5; font-family: Arial, sans-serif; margin: 0; padding: 0; }
  h1 { text-align: center; padding: 20px 0; margin: 0; }
  .container { width: 90%; max-width: 900px; margin: 20px auto; padding: 20px; background: #1e1e1e; border-radius: 10px; }
  h2 { margin-top: 0; }
  .endpoint-box { background: #2a2a2a; padding: 15px; margin-bottom: 25px; border-radius: 10px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 10px; border-radius: 8px; background: #333; color: #fff; border: 1px solid #555; }
  textarea { height: 120px; resize: vertical; overflow-y: auto; word-wrap: break-word; }
  button { margin-top: 10px; padding: 10px 20px; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #45a049; }
</style>
</head>

<body>

<h1>Node Endpoint Tester</h1>

<div class="container">

  <div class="endpoint-box">
    <h2>Login</h2>
    <input id="login-email" placeholder="Email" value="test@gmail.com">
    <input id="login-password" type="password" placeholder="Password" value="123456">
    <button onclick="login()">Login</button>
    <textarea id="login-response" readonly></textarea>
  </div>

  <div class="endpoint-box">
    <h2>GET /products</h2>
    <button onclick="getAll()">GET ALL</button>
    <textarea id="getall-response" readonly></textarea>
  </div>

  <div class="endpoint-box">
    <h2>GET /products/:id</h2>
    <input id="get-id" placeholder="ID del producto">
    <button onclick="getOne()">GET BY ID</button>
    <textarea id="getone-response" readonly></textarea>
  </div>

  <div class="endpoint-box">
    <h2>POST /products</h2>
    <input id="create-name" placeholder="Nombre del producto">
    <input id="create-price" placeholder="Precio">
    <button onclick="createProduct()">CREAR PRODUCTO</button>
    <textarea id="create-response" readonly></textarea>
  </div>

  <div class="endpoint-box">
    <h2>DELETE /products/:id</h2>
    <input id="delete-id" placeholder="ID a eliminar">
    <button onclick="deleteProduct()">BORRAR</button>
    <textarea id="delete-response" readonly></textarea>
  </div>

</div>

<script>
const BASE_URL = "https://node-talento-tech-eta.vercel.app/api";
let token = localStorage.getItem('ntt_token') || "";

function setToken(t) {
  token = t || "";
  if (token) localStorage.setItem('ntt_token', token);
  else localStorage.removeItem('ntt_token');
}

async function login() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value.trim();
  if (!email || !password) {
    document.getElementById("login-response").value = "Completar email y password";
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    setToken(data.token || "");
    document.getElementById("login-response").value = JSON.stringify(data, null, 2);
  } catch {
    document.getElementById("login-response").value = "Error en login";
  }
}

function authHeader() {
  return { Authorization: `Bearer ${token}` };
}

async function getAll() {
  if (!token) {
    document.getElementById("getall-response").value = "Hacer login primero";
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/products`, { headers: authHeader() });
    const data = await res.json();
    document.getElementById("getall-response").value = JSON.stringify(data, null, 2);
  } catch {
    document.getElementById("getall-response").value = "Error al obtener datos";
  }
}

async function getOne() {
  const id = document.getElementById("get-id").value.trim();
  if (!id) {
    document.getElementById("getone-response").value = "Ingresar un ID";
    return;
  }
  if (!token) {
    document.getElementById("getone-response").value = "Hacer login primero";
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/products/${id}`, { headers: authHeader() });
    const data = await res.json();
    document.getElementById("getone-response").value = JSON.stringify(data, null, 2);
  } catch {
    document.getElementById("getone-response").value = "Error al obtener producto";
  }
}

async function createProduct() {
  const name = document.getElementById("create-name").value.trim();
  const price = document.getElementById("create-price").value.trim();
  if (!name || !price) {
    document.getElementById("create-response").value = "Completar nombre y precio";
    return;
  }
  if (!token) {
    document.getElementById("create-response").value = "Hacer login primero";
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/products/create`, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeader()),
      body: JSON.stringify({ name, price })
    });
    const data = await res.json();
    document.getElementById("create-response").value = JSON.stringify(data, null, 2);
  } catch {
    document.getElementById("create-response").value = "Error al crear producto";
  }
}

async function deleteProduct() {
  const id = document.getElementById("delete-id").value.trim();
  if (!id) {
    document.getElementById("delete-response").value = "Ingresar un ID";
    return;
  }
  if (!token) {
    document.getElementById("delete-response").value = "Hacer login primero";
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/products/${id}`, {
      method: "DELETE",
      headers: authHeader()
    });
    const data = await res.json();
    document.getElementById("delete-response").value = JSON.stringify(data, null, 2);
  } catch {
    document.getElementById("delete-response").value = "Error al borrar producto";
  }
}
</script>

</body>
</html>
